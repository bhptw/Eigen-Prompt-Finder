<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Eigen Prompt Finder</title>

  <meta
    name="description"
    content="Siemens Eigen Engineering Agent Plain Text Prompt Library"
  >

  <style>
    /* =========================================================
       01. Theme Variables
       ========================================================= */

    :root {
      --bg: #f6f7f9;

      --surface: #ffffff;
      --surface-soft: #f4f6f8;
      --surface-code: #eef2f5;

      --text: #161b22;
      --text-secondary: #4f5965;
      --text-muted: #76818d;

      /* Light Mode：提高白底邊框辨識度 */
      --border: #aeb7c2;
      --border-strong: #7f8a96;

      --accent: #0072ce;
      --accent-hover: #005da8;
      --accent-soft: #e8f3fb;

      --success: #168357;

      --shadow-small:
        0 2px 8px rgba(0, 0, 0, 0.05);

      --shadow-medium:
        0 8px 24px rgba(0, 0, 0, 0.09);

      --toolbar-bg:
        rgba(255, 255, 255, 0.96);

      --toolbar-hover: #edf3f7;
    }

    body.dark-mode {
      --bg: #101418;

      --surface: #1b2026;
      --surface-soft: #222930;
      --surface-code: #252d35;

      --text: #f2f4f7;
      --text-secondary: #bec6ce;
      --text-muted: #919ba6;

      /* Dark Mode Border */
      --border: #414b56;
      --border-strong: #66717d;

      --accent: #42a5e8;
      --accent-hover: #65b5eb;
      --accent-soft: #17334a;

      --success: #55c791;

      --shadow-small:
        0 2px 10px rgba(0, 0, 0, 0.25);

      --shadow-medium:
        0 8px 28px rgba(0, 0, 0, 0.36);

      --toolbar-bg:
        rgba(27, 32, 38, 0.97);

      --toolbar-hover: #303943;
    }


    /* =========================================================
       02. Reset / Base
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      font-size: 16px;
      line-height: 1.6;

      transition:
        background-color 0.22s ease,
        color 0.22s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }


    /* =========================================================
       03. Header
       ========================================================= */

    .site-header {
      background: var(--surface);

      border-bottom:
        1px solid var(--border);
    }

    .header-wrap {
      max-width: 1180px;

      margin: 0 auto;

      padding: 22px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 28px;
    }

    .brand-area {
      display: flex;
      align-items: center;

      gap: 20px;

      min-width: 0;
    }

    .brand-logo-link {
      display: flex;

      align-items: center;

      flex-shrink: 0;
    }

    .brand-logo {
      display: block;

      width: 170px;
      height: auto;

      max-height: 62px;

      object-fit: contain;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      margin: 0;

      font-size: 29px;
      line-height: 1.25;

      letter-spacing: -0.3px;
    }

    .brand-text p {
      margin: 5px 0 0;

      color: var(--text-secondary);

      font-size: 14px;
    }

    .company-link {
      color: var(--accent);

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      flex-shrink: 0;
    }

    .company-link:hover {
      text-decoration: underline;
    }


    /* =========================================================
       04. Main Layout
       ========================================================= */

    .page-wrap {
      max-width: 1180px;

      margin: 0 auto;

      padding: 36px 24px 72px;
    }


    /* =========================================================
       05. Hero
       ========================================================= */

    .hero {
      text-align: center;

      margin-bottom: 30px;
    }

    .hero-title {
      margin: 0;

      font-size: 31px;
      line-height: 1.3;
    }

    .hero-subtitle {
      max-width: 760px;

      margin: 8px auto 0;

      color: var(--text-secondary);

      font-size: 15px;
    }


    /* =========================================================
       06. Search
       ========================================================= */

    .search-section {
      max-width: 900px;

      margin: 0 auto 22px;
    }

    .search-label {
      display: block;

      margin-bottom: 8px;

      font-size: 17px;
      font-weight: 700;
    }

    .search-box {
      width: 100%;

      padding: 15px 17px;

      background: var(--surface);
      color: var(--text);

      border:
        1px solid var(--border);

      border-radius: 13px;

      outline: none;

      box-shadow: var(--shadow-small);

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .search-box:hover {
      border-color:
        var(--border-strong);
    }

    .search-box:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px var(--accent-soft);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }


    /* =========================================================
       07. Statistics
       ========================================================= */

    .stats-panel {
      max-width: 900px;

      margin: 0 auto 24px;

      padding: 15px 18px;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 13px;

      box-shadow: var(--shadow-small);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .stats-main {
      font-weight: 700;

      flex-shrink: 0;
    }

    .stats-detail {
      color: var(--text-secondary);

      font-size: 14px;

      text-align: right;
    }


    /* =========================================================
       08. Category Buttons
       ========================================================= */

    .category-section {
      margin-bottom: 32px;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;
    }

    .category-button {
      padding: 9px 15px;

      background: var(--surface);
      color: var(--text);

      border:
        1px solid var(--border);

      border-radius: 999px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 650;

      transition:
        background-color 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        transform 0.15s ease;
    }

    .category-button:hover {
      border-color: var(--accent);

      transform: translateY(-1px);
    }

    .category-button.active {
      background: var(--accent);

      color: #ffffff;

      border-color: var(--accent);
    }

    .category-button.disabled {
      opacity: 0.4;

      cursor: not-allowed;

      transform: none;
    }


    /* =========================================================
       09. Prompt Grid
       ========================================================= */

    .prompt-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 22px;
    }


    /* =========================================================
       10. Prompt Card
       ========================================================= */

    .prompt-card {
      display: flex;
      flex-direction: column;

      min-width: 0;

      padding: 23px;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 17px;

      box-shadow: var(--shadow-small);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .prompt-card:hover {
      transform: translateY(-2px);

      border-color:
        var(--border-strong);

      box-shadow:
        var(--shadow-medium);
    }

    .prompt-title {
      margin: 0 0 10px;

      font-size: 21px;
      line-height: 1.4;
    }

    .prompt-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 13px;
    }

    .tag {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      background:
        var(--surface-soft);

      color:
        var(--text-secondary);

      border:
        1px solid var(--border);

      border-radius: 999px;

      font-size: 12px;

      line-height: 1.2;
    }

    .tag.category {
      background:
        var(--accent-soft);

      color:
        var(--accent);

      border-color:
        var(--accent);

      font-weight: 700;
    }

    .prompt-description {
      margin: 0 0 15px;

      color:
        var(--text-secondary);

      font-size: 14px;
    }


    /* =========================================================
       11. Prompt Text
       ========================================================= */

    .prompt-content-wrap {
      margin-bottom: 16px;

      position: relative;
    }

    .prompt-content {
      margin: 0;

      padding: 15px 16px;

      background:
        var(--surface-code);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-left:
        4px solid var(--accent);

      border-radius: 10px;

      white-space: pre-wrap;
      word-break: break-word;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

      font-size: 13px;

      line-height: 1.65;

      max-height: 220px;

      overflow: hidden;

      transition:
        max-height 0.25s ease;
    }

    .prompt-content.expanded {
      max-height: 3000px;
    }


    /* =========================================================
       12. Prompt Actions
       ========================================================= */

    .prompt-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 9px;

      margin-top: auto;
    }

    .action-button {
      padding: 9px 13px;

      background:
        var(--surface);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius: 9px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;

      transition:
        background-color 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease;
    }

    .action-button:hover {
      border-color:
        var(--accent);
    }

    .action-button.primary {
      background:
        var(--accent);

      color:
        #ffffff;

      border-color:
        var(--accent);
    }

    .action-button.primary:hover {
      background:
        var(--accent-hover);

      border-color:
        var(--accent-hover);
    }

    .action-button.success {
      background:
        var(--success);

      color:
        #ffffff;

      border-color:
        var(--success);
    }


    /* =========================================================
       13. Details
       ========================================================= */

    .prompt-details {
      display: none;

      margin-top: 16px;

      padding-top: 16px;

      border-top:
        1px solid var(--border);
    }

    .prompt-details.open {
      display: block;
    }

    .detail-row {
      display: grid;

      grid-template-columns:
        145px 1fr;

      gap: 12px;

      margin-bottom: 9px;

      font-size: 13px;
    }

    .detail-label {
      color: var(--text);

      font-weight: 700;
    }

    .detail-value {
      color:
        var(--text-secondary);

      word-break: break-word;
    }


    /* =========================================================
       14. Empty State
       ========================================================= */

    .empty-state {
      display: none;

      padding: 60px 20px;

      text-align: center;

      color:
        var(--text-secondary);
    }

    .empty-state.show {
      display: block;
    }


    /* =========================================================
       15. Footer
       ========================================================= */

    .site-footer {
      background:
        var(--surface);

      border-top:
        1px solid var(--border);
    }

    .footer-wrap {
      max-width: 1180px;

      margin: 0 auto;

      padding: 25px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;

      gap: 3px;
    }

    .footer-brand span {
      color:
        var(--text-secondary);

      font-size: 13px;
    }

    .footer-link {
      color:
        var(--accent);

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;
    }

    .footer-link:hover {
      text-decoration: underline;
    }


    /* =========================================================
       16. Floating Toolbar
       ========================================================= */

    .floating-toolbar {
      position: fixed;

      right: 22px;
      bottom: 24px;

      display: flex;
      flex-direction: column;

      gap: 8px;

      z-index: 9999;
    }

    .tool-button {
      position: relative;

      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      background:
        var(--toolbar-bg);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius: 12px;

      cursor: pointer;

      font-size: 18px;
      font-weight: 700;

      box-shadow:
        var(--shadow-small);

      backdrop-filter: blur(8px);

      transition:
        background-color 0.18s ease,
        border-color 0.18s ease,
        transform 0.15s ease;
    }

    .tool-button:hover {
      background:
        var(--toolbar-hover);

      border-color:
        var(--accent);

      transform:
        translateY(-1px);
    }

    .tool-button::before {
      content:
        attr(data-tooltip);

      position: absolute;

      right: 56px;

      white-space: nowrap;

      padding: 6px 9px;

      background:
        var(--surface);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius: 8px;

      box-shadow:
        var(--shadow-small);

      font-size: 12px;
      font-weight: 600;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.15s ease;
    }

    .tool-button:hover::before {
      opacity: 1;
      visibility: visible;
    }


    /* =========================================================
       17. Zoom Indicator
       ========================================================= */

    .zoom-indicator {
      position: fixed;

      right: 80px;
      bottom: 125px;

      padding: 6px 10px;

      background:
        var(--surface);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius: 8px;

      box-shadow:
        var(--shadow-small);

      font-size: 12px;
      font-weight: 700;

      opacity: 0;
      visibility: hidden;

      z-index: 9998;

      transition:
        opacity 0.18s ease;
    }

    .zoom-indicator.show {
      opacity: 1;
      visibility: visible;
    }


    /* =========================================================
       18. Toast
       ========================================================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 30px;

      transform:
        translateX(-50%)
        translateY(12px);

      padding: 10px 16px;

      background:
        var(--text);

      color:
        var(--surface);

      border-radius: 10px;

      box-shadow:
        var(--shadow-medium);

      font-size: 13px;
      font-weight: 700;

      opacity: 0;
      visibility: hidden;

      z-index: 10000;

      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================================================
       19. Responsive
       ========================================================= */

    @media (max-width: 900px) {
      .prompt-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .header-wrap {
        flex-direction: column;

        align-items: flex-start;
      }

      .brand-area {
        align-items: flex-start;
      }

      .brand-logo {
        width: 145px;
      }

      .brand-text h1 {
        font-size: 24px;
      }

      .hero-title {
        font-size: 26px;
      }

      .stats-panel {
        flex-direction: column;

        align-items: flex-start;
      }

      .stats-detail {
        text-align: left;
      }

      .detail-row {
        grid-template-columns: 1fr;

        gap: 3px;
      }

      .footer-wrap {
        flex-direction: column;

        align-items: flex-start;
      }

      .floating-toolbar {
        right: 12px;
        bottom: 14px;

        gap: 6px;
      }

      .tool-button {
        width: 40px;
        height: 40px;

        border-radius: 10px;

        font-size: 16px;
      }

      .tool-button::before {
        display: none;
      }

      .zoom-indicator {
        right: 60px;
        bottom: 105px;
      }

      .toast {
        bottom: 18px;

        max-width:
          calc(100% - 30px);

        text-align: center;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <div class="header-wrap">

      <div class="brand-area">

        <a
          class="brand-logo-link"
          href="https://www.bhp.com.tw/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="brand-logo"
            src="bhp-logo.png"
            alt="BHP 司騰達股份有限公司"
          >
        </a>

        <div class="brand-text">

          <h1>
            Eigen Prompt Finder
          </h1>

          <p>
            Siemens Eigen Engineering Agent Plain Text Prompt Library
          </p>

        </div>

      </div>

      <a
        class="company-link"
        href="https://www.bhp.com.tw/"
        target="_blank"
        rel="noopener noreferrer"
      >
        www.bhp.com.tw
      </a>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="page-wrap">

    <section class="hero">

      <h2 class="hero-title">
        Eigen Engineering Prompt Library
      </h2>

      <p class="hero-subtitle">
        使用自然語言快速搜尋適合 Siemens Eigen Engineering Agent 的工程 Prompt。
      </p>

    </section>


    <!-- SEARCH -->

    <section class="search-section">

      <label
        class="search-label"
        for="searchInput"
      >

      </label>

      <input
        id="searchInput"

    <!-- STATISTICS -->

    <section class="stats-panel">

      <div
        id="totalStats"

        載入 Prompt 中...
      </div>

      <div
        id="categoryStats"
        class="stats-detail"

    </section>


    <!-- CATEGORY -->

    <section class="category-section">

      <div
        id="categoryButtons"
        class="category-buttons"
      ></div>

    </section>


    <!-- PROMPTS -->

    <section
      id="promptGrid"
      class="prompt-grid"
    ></section>


    <div
      id="emptyState"
      class="empty-state"

      找不到符合條件的 Prompt。
    </div>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <div class="footer-wrap">

      <div class="footer-brand">

        <strong>
          BHP 司騰達股份有限公司
        </strong>

        <span>
          Eigen Prompt Finder
        </span>

      </div>

      <a
        class="footer-link"
        href="https://www.bhp.com.tw/"
        target="_blank"
        rel="noopener noreferrer"
      >
        www.bhp.com.tw
      </a>

    </div>

  </footer>


  <!-- =====================================================
       FLOATING TOOLBAR
       ===================================================== -->

  <div
    class="floating-toolbar"
    aria-label="網站工具列"
  >

    <button
      id="themeToggle"
      class="tool-button"
      type="button"
      data-tooltip="切換 Dark Mode"
      aria-label="切換 Light / Dark Mode"
    >
      🌙
    </button>


    <button
      id="zoomIn"
      class="tool-button"
      type="button"
      data-tooltip="放大"
      aria-label="放大"
    >
      ＋
    </button>


    <button
      id="zoomOut"
      class="tool-button"
      type="button"
      data-tooltip="縮小"
      aria-label="縮小"
    >
      −
    </button>


    <button
      id="zoomReset"
      class="tool-button"
      type="button"
      data-tooltip="預設大小 100%"
      aria-label="恢復預設大小"
    >
      ↺
    </button>


    <button
      id="resetFilters"
      class="tool-button"
      type="button"
      data-tooltip="清除搜尋與篩選"
      aria-label="清除搜尋與篩選"
    >
      ×
    </button>


    <button
      id="copyUrl"
      class="tool-button"
      type="button"
      data-tooltip="複製目前網址"
      aria-label="複製目前網址"
    >
      🔗
    </button>


    <button
      id="scrollTop"
      class="tool-button"
      type="button"
      data-tooltip="回到最上頁"
      aria-label="回到最上頁"
    >
      ↑
    </button>

  </div>


  <div
    id="zoomIndicator"
    class="zoom-indicator"
  >
    100%
  </div>


  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>
    "use strict";


    /* =====================================================
       01. State
       ===================================================== */

    let prompts = [];

    let currentCategory = "全部";


    /* =====================================================
       02. Elements
       ===================================================== */

    const searchInput =
      document.getElementById("searchInput");

    const promptGrid =
      document.getElementById("promptGrid");

    const categoryButtons =
      document.getElementById("categoryButtons");

    const totalStats =
      document.getElementById("totalStats");

    const categoryStats =
      document.getElementById("categoryStats");

    const emptyState =
      document.getElementById("emptyState");


    const themeToggle =
      document.getElementById("themeToggle");

    const zoomIn =
      document.getElementById("zoomIn");

    const zoomOut =
      document.getElementById("zoomOut");

    const zoomReset =
      document.getElementById("zoomReset");

    const resetFilters =
      document.getElementById("resetFilters");

    const copyUrl =
      document.getElementById("copyUrl");

    const scrollTopButton =
      document.getElementById("scrollTop");


    const zoomIndicator =
      document.getElementById("zoomIndicator");

    const toast =
      document.getElementById("toast");


    /* =====================================================
       03. Utilities
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function showToast(message) {

      toast.textContent = message;

      toast.classList.add("show");


      clearTimeout(showToast.timer);


      showToast.timer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 1600);

    }


    function showZoomIndicator(value) {

      zoomIndicator.textContent =
        `${Math.round(value * 100)}%`;


      zoomIndicator.classList.add("show");


      clearTimeout(showZoomIndicator.timer);


      showZoomIndicator.timer =
        setTimeout(() => {

          zoomIndicator.classList.remove("show");

        }, 1000);

    }


    /* =====================================================
       04. Load prompts.json
       ===================================================== */

    fetch("prompts.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "prompts.json 載入失敗"
          );

        }


        return response.json();

      })

      .then(data => {

        prompts =
          Array.isArray(data)
            ? data
            : [];


        buildCategories();

        updateStats();

        renderPrompts();

      })

      .catch(error => {

        console.error(error);


        totalStats.textContent =
          "Prompt 載入失敗";


        categoryStats.textContent =
          "";


        promptGrid.innerHTML = `

          <article class="prompt-card">

            <h3 class="prompt-title">
              無法載入 prompts.json
            </h3>

            <p class="prompt-description">
              請確認 prompts.json 與 index.html 位於 Repository 根目錄。
            </p>

          </article>

        `;

      });


    /* =====================================================
       05. Categories
       ===================================================== */

    function getCategoryCounts() {

      const counts = {};


      prompts.forEach(item => {

        const category =
          item.category || "未分類";


        counts[category] =
          (counts[category] || 0) + 1;

      });


      return counts;

    }


    function buildCategories() {

      const counts =
        getCategoryCounts();


      const preferredOrder = [

        "PLC Programming",
        "Hardware",
        "Documentation",
        "Testing / QA",
        "HMI",
        "Drive",
        "Project Context"

      ];


      const actualCategories =
        Object.keys(counts);


      const categories = [

        ...preferredOrder.filter(
          category =>
            actualCategories.includes(category)
        ),

        ...actualCategories.filter(
          category =>
            !preferredOrder.includes(category)
        )

      ];


      categoryButtons.innerHTML = "";


      categoryButtons.appendChild(

        createCategoryButton(
          "全部",
          prompts.length
        )

      );


      categories.forEach(category => {

        categoryButtons.appendChild(

          createCategoryButton(
            category,
            counts[category]
          )

        );

      });


      updateCategoryActiveState();

    }


    function createCategoryButton(
      category,
      count
    ) {

      const button =
        document.createElement("button");


      button.type = "button";

      button.className =
        "category-button";

      button.dataset.category =
        category;

      button.textContent =
        `${category} (${count})`;


      if (count === 0) {

        button.disabled = true;

        button.classList.add(
          "disabled"
        );

      }


      button.addEventListener(
        "click",
        () => {

          currentCategory =
            category;


          updateCategoryActiveState();

          renderPrompts();

        }
      );


      return button;

    }


    function updateCategoryActiveState() {

      document
        .querySelectorAll(
          ".category-button"
        )
        .forEach(button => {

          button.classList.toggle(

            "active",

            button.dataset.category ===
              currentCategory

          );

        });

    }


    /* =====================================================
       06. Search
       ===================================================== */

    searchInput.addEventListener(
      "input",
      renderPrompts
    );


    function getFilteredPrompts() {

      const keyword =
        searchInput
          .value
          .trim()
          .toLowerCase();


      return prompts.filter(item => {

        const matchesCategory =

          currentCategory === "全部" ||

          item.category ===
            currentCategory;


        const searchableText = [

          item.id,
          item.category,
          item.title,
          item.description,
          item.usage,
          item.prompt,
          item.requiredInput,
          item.officialCategory,
          item.officialReference,
          item.version,

          ...(
            Array.isArray(item.tags)
              ? item.tags
              : []
          )

        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        const matchesKeyword =

          keyword === "" ||

          searchableText.includes(
            keyword
          );


        return (
          matchesCategory &&
          matchesKeyword
        );

      });

    }


    /* =====================================================
       07. Statistics
       ===================================================== */

    function updateStats() {

      const counts =
        getCategoryCounts();


      totalStats.textContent =

        `目前共 ${prompts.length} 筆工程 Prompt`;


      categoryStats.textContent =

        Object
          .entries(counts)
          .map(
            ([category, count]) =>
              `${category}: ${count}`
          )
          .join(" ｜ ");

    }


    /* =====================================================
       08. Render Prompt Cards
       ===================================================== */

    function renderPrompts() {

      const filtered =
        getFilteredPrompts();


      promptGrid.innerHTML = "";


      emptyState.classList.toggle(

        "show",

        filtered.length === 0

      );


      filtered.forEach(item => {

        promptGrid.appendChild(

          createPromptCard(item)

        );

      });

    }


    function createPromptCard(item) {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "prompt-card";


      const tags =
        Array.isArray(item.tags)
          ? item.tags
          : [];


      const tagsHtml =

        tags

          .map(
            tag =>
              `<span class="tag">${escapeHtml(tag)}</span>`
          )

          .join("");


      card.innerHTML = `

        <h3 class="prompt-title">

          ${escapeHtml(
            item.title ||
            "未命名 Prompt"
          )}

        </h3>


        <div class="prompt-meta">

          <span class="tag category">

            ${escapeHtml(
              item.category ||
              "未分類"
            )}

          </span>

          ${tagsHtml}

        </div>


        <p class="prompt-description">

          ${escapeHtml(
            item.description || ""
          )}

        </p>


        <div class="prompt-content-wrap">

          <pre class="prompt-content">${escapeHtml(item.prompt || "")}</pre>

        </div>


        <div class="prompt-actions">

          <button
            class="action-button primary copy-prompt-button"
            type="button"
          >
            複製 Prompt
          </button>


          <button
            class="action-button expand-prompt-button"
            type="button"
          >
            展開全文
          </button>


          <button
            class="action-button details-button"
            type="button"
          >
            詳細資訊
          </button>

        </div>


        <div class="prompt-details">


          <div class="detail-row">

            <div class="detail-label">
              使用情境
            </div>

            <div class="detail-value">
              ${escapeHtml(item.usage || "—")}
            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">
              需要輸入
            </div>

            <div class="detail-value">
              ${escapeHtml(item.requiredInput || "—")}
            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">
              Prompt Library 分類
            </div>

            <div class="detail-value">
              ${escapeHtml(
                item.officialCategory ||
                item.category ||
                "—"
              )}
            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">
              參考來源
            </div>

            <div class="detail-value">
              ${escapeHtml(
                item.officialReference ||
                "—"
              )}
            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">
              版本
            </div>

            <div class="detail-value">
              ${escapeHtml(
                item.version ||
                "—"
              )}
            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">
              Prompt ID
            </div>

            <div class="detail-value">
              ${escapeHtml(
                item.id ||
                "—"
              )}
            </div>

          </div>

        </div>
      `;


      const promptContent =
        card.querySelector(
          ".prompt-content"
        );


      const copyButton =
        card.querySelector(
          ".copy-prompt-button"
        );


      const expandButton =
        card.querySelector(
          ".expand-prompt-button"
        );


      const detailsButton =
        card.querySelector(
          ".details-button"
        );


      const details =
        card.querySelector(
          ".prompt-details"
        );


      /* COPY PROMPT */

      copyButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard
              .writeText(
                item.prompt || ""
              );


            copyButton.textContent =
              "已複製";


            copyButton.classList.add(
              "success"
            );


            setTimeout(
              () => {

                copyButton.textContent =
                  "複製 Prompt";


                copyButton.classList.remove(
                  "success"
                );

              },
              1300
            );

          }

          catch (error) {

            console.error(error);

            showToast(
              "無法複製 Prompt"
            );

          }

        }
      );


      /* EXPAND */

      expandButton.addEventListener(
        "click",
        () => {

          const expanded =

            promptContent
              .classList
              .toggle("expanded");


          expandButton.textContent =

            expanded
              ? "收合全文"
              : "展開全文";

        }
      );


      /* DETAILS */

      detailsButton.addEventListener(
        "click",
        () => {

          const open =

            details
              .classList
              .toggle("open");


          detailsButton.textContent =

            open
              ? "收合資訊"
              : "詳細資訊";

        }
      );


      return card;

    }


    /* =====================================================
       09. Theme
       ===================================================== */

    function applyTheme(theme) {

      const dark =
        theme === "dark";


      document.body.classList.toggle(

        "dark-mode",

        dark

      );


      themeToggle.textContent =

        dark
          ? "☀"
          : "🌙";


      themeToggle.dataset.tooltip =

        dark
          ? "切換 Light Mode"
          : "切換 Dark Mode";


      localStorage.setItem(

        "eigenPromptTheme",

        theme

      );

    }


    const savedTheme =
      localStorage.getItem(
        "eigenPromptTheme"
      );


    if (
      savedTheme === "light" ||
      savedTheme === "dark"
    ) {

      applyTheme(savedTheme);

    }

    else {

      const systemDark =

        window.matchMedia &&
        window
          .matchMedia(
            "(prefers-color-scheme: dark)"
          )
          .matches;


      applyTheme(
        systemDark
          ? "dark"
          : "light"
      );

    }


    themeToggle.addEventListener(
      "click",
      () => {

        const dark =
          document.body
            .classList
            .contains(
              "dark-mode"
            );


        applyTheme(
          dark
            ? "light"
            : "dark"
        );

      }
    );


    /* =====================================================
       10. Zoom
       ===================================================== */

    const ZOOM_MIN = 0.8;

    const ZOOM_MAX = 1.4;

    const ZOOM_STEP = 0.1;


    let currentZoom =

      parseFloat(
        localStorage.getItem(
          "eigenPromptZoom"
        )
      ) || 1;


    function clampZoom(value) {

      return Math.min(

        ZOOM_MAX,

        Math.max(
          ZOOM_MIN,
          value
        )

      );

    }


    function applyZoom(
      value,
      showIndicator = false
    ) {

      currentZoom =

        Math.round(
          clampZoom(value) * 10
        ) / 10;


      /*
        Chrome / Edge：
        讓整體 UI 一起縮放，
        包含文字、卡片、按鈕與間距。
      */

      document.body.style.zoom =
        currentZoom;


      localStorage.setItem(

        "eigenPromptZoom",

        currentZoom

      );


      if (showIndicator) {

        showZoomIndicator(
          currentZoom
        );

      }

    }


    applyZoom(currentZoom);


    zoomIn.addEventListener(
      "click",
      () => {

        applyZoom(

          currentZoom +
          ZOOM_STEP,

          true

        );

      }
    );


    zoomOut.addEventListener(
      "click",
      () => {

        applyZoom(

          currentZoom -
          ZOOM_STEP,

          true

        );

      }
    );


    zoomReset.addEventListener(
      "click",
      () => {

        applyZoom(
          1,
          true
        );

      }
    );


    /* =====================================================
       11. Reset Search / Filter
       ===================================================== */

    resetFilters.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        currentCategory = "全部";


        updateCategoryActiveState();

        renderPrompts();


        window.scrollTo({

          top: 0,

          behavior: "smooth"

        });


        showToast(
          "已清除搜尋與分類"
        );

      }
    );


    /* =====================================================
       12. Copy URL
       ===================================================== */

    copyUrl.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard
            .writeText(
              window.location.href
            );


          showToast(
            "網址已複製"
          );

        }

        catch (error) {

          console.error(error);

          showToast(
            "無法複製網址"
          );

        }

      }
    );


    /* =====================================================
       13. Scroll Top
       ===================================================== */

    scrollTopButton.addEventListener(
      "click",
      () => {

        window.scrollTo({

          top: 0,

          behavior: "smooth"

        });

      }
    );

  </script>

</body>
</html>
